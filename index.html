<!DOCTYPE html>
<!--
  Absensi Kru Mobil Tangki
  Hak Cipta (c) 2026 Deny Akbar
  Versi V2.2
-->
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006CB8">
  <meta name="color-scheme" content="light only">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Absensi Kru">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Absensi kru mobil tangki dan karyawan PT Patra Logistik FT Pangkalan Bun">
  <title>Absensi Kru Mobil Tangki</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="appbar" class="appbar">
    <img class="appbar-logo logo" src="assets/logo-patra-logistik.png" alt="Patra Logistik">
    <div class="appbar-judul">
      <div class="appbar-nama">Absensi Kru</div>
      <div class="appbar-sub">FT Pangkalan Bun</div>
    </div>
    <div id="appbar-aksi" class="appbar-aksi" hidden>
      <button type="button" id="btn-segarkan" class="ikon-btn" data-ikon="muat" aria-label="Muat ulang daftar" title="Muat ulang daftar"></button>
      <button type="button" id="btn-keluar" class="ikon-btn" data-ikon="keluar" aria-label="Keluar" title="Keluar"></button>
    </div>
  </header>

  <button type="button" id="pita" class="pita" hidden></button>

  <main>
    <!-- Masuk admin -->
    <section id="v-login" hidden>
      <div class="masuk">
        <img class="masuk-logo logo" src="assets/logo-patra-logistik.png" alt="Patra Logistik">
        <h1 class="masuk-judul">Masuk Admin</h1>
        <p class="masuk-sub">Absensi Kru · FT Pangkalan Bun</p>
        <form id="form-login" autocomplete="on" novalidate>
          <label for="in-pin" class="label">PIN</label>
          <div class="input-pin">
            <input id="in-pin" name="password" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6"
              autocomplete="current-password" placeholder="••••••">
            <button type="button" id="btn-lihat-pin" class="ikon-btn lihat" data-ikon="mata" aria-controls="in-pin"
              aria-pressed="false" aria-label="Tampilkan PIN"></button>
          </div>
          <div id="pesan-login" class="pesan-galat" role="alert" hidden></div>
          <button type="submit" id="btn-masuk" class="tombol">Masuk</button>
        </form>
        <button type="button" id="btn-pasang" class="tombol-teks" hidden>Pasang aplikasi</button>
      </div>
    </section>

    <!-- Daftar nama -->
    <section id="v-beranda" hidden>
      <div class="ringkas">
        <div class="ringkas-atas">
          <span id="tgl-hari" class="ringkas-tgl"></span>
          <span id="info-lokasi" class="gps"></span>
        </div>
        <div class="ringkas-angka"><span id="hitung-hadir" class="angka"></span><span class="ringkas-label">hadir</span></div>
        <div class="progres" aria-hidden="true"><span id="progres-hadir"></span></div>
      </div>
      <div class="cari">
        <span class="cari-ikon" data-ikon="cari" aria-hidden="true"></span>
        <input id="cari" type="search" class="input-cari" placeholder="Cari nama atau nopol" aria-label="Cari nama atau nopol"
          autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
      </div>
      <div class="segmen" role="group" aria-label="Saring daftar">
        <button type="button" class="pilih-saring" data-saring="semua" aria-pressed="true">Semua</button>
        <button type="button" class="pilih-saring" data-saring="amt" aria-pressed="false">AMT</button>
        <button type="button" class="pilih-saring" data-saring="karyawan" aria-pressed="false">Karyawan</button>
      </div>
      <ul id="daftar-kru" class="daftar"></ul>
    </section>

    <!-- Absen satu orang -->
    <section id="v-alur" hidden>
      <div id="isi-alur"></div>
    </section>
  </main>

  <footer id="kaki" class="kaki">Hak Cipta © 2026 Deny Akbar · V2.2</footer>

  <!-- Tombol yang tetap di bawah layar saat absen -->
  <div id="bar-aksi" class="bar-aksi" hidden>
    <div id="bar-isi" class="bar-isi"></div>
  </div>

  <!-- Kamera layar penuh -->
  <div id="kamera" class="kamera" hidden>
    <video id="kamera-video" playsinline muted autoplay></video>
    <div id="kamera-bingkai" class="kamera-oval" aria-hidden="true"></div>
    <div class="kamera-atas">
      <span id="kamera-nama" class="kamera-nama"></span>
      <button type="button" id="kamera-batal" class="ikon-btn terang" data-ikon="tutup" aria-label="Tutup kamera"></button>
    </div>
    <div id="kamera-pesan" class="kamera-pesan" role="status"></div>
    <div class="kamera-bawah">
      <span class="kamera-sisi"></span>
      <button type="button" id="kamera-jepret" class="rana" aria-label="Ambil foto"></button>
      <span class="kamera-sisi">
        <button type="button" id="kamera-senter" class="ikon-btn terang" data-ikon="senter" aria-label="Senter" aria-pressed="false" hidden></button>
      </span>
    </div>
  </div>

  <!-- Dialog pesan -->
  <div id="lapisan" class="lapisan" hidden>
    <div id="dialog" class="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <script src="config.js"></script>
  <script src="js/inti.js"></script>
  <script src="js/perangkat.js"></script>
  <script src="js/antrian.js"></script>
  <script src="js/alur.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
